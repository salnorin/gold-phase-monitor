name: native
on:
  push: { paths: ["native/**", "core/arena.py", "tests/test_native.py", ".github/workflows/native.yml"] }
  pull_request: { paths: ["native/**", "core/arena.py", "tests/test_native.py", ".github/workflows/native.yml"] }
jobs:
  build-test:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements.txt -r requirements-dev.txt maturin
      - run: maturin build --release -m native/gpm_native/Cargo.toml -o dist
      - run: pip install --no-index --find-links dist gpm_native
      - run: python -m pytest -q tests/test_native.py tests/test_arena.py
      - uses: actions/upload-artifact@v4
        with: { name: "gpm_native-${{ matrix.os }}", path: dist/*.whl }
