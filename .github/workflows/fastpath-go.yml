name: fastpath-go
on:
  push: { paths: ["fastpath-go/**", ".github/workflows/fastpath-go.yml"] }
  pull_request: { paths: ["fastpath-go/**", ".github/workflows/fastpath-go.yml"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fastpath-go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: fastpath-go/go.sum }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go test -run xxx -bench . -benchmem
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    defaults: { run: { working-directory: fastpath-go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: fastpath-go/go.sum }
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w" -o dist/fastpath-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .
      - uses: actions/upload-artifact@v4
        with: { name: "fastpath-${{ matrix.goos }}-${{ matrix.goarch }}", path: "fastpath-go/dist/*" }
