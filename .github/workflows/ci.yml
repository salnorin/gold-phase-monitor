name: CI
on:
  push:
    branches: [main, "organism-*", "data-sources"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Import smoke test
        run: python -c "import core.organism, core.mind, core.arena, core.paper, core.market_hours, core.crypto, core.fx, core.backtest, core.research; print('imports ok')"
      - name: Tests
        run: python -m pytest -q
