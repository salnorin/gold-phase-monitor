[package]
name = "gpm_native"
version = "0.1.0"
edition = "2021"
description = "Gold Phase Monitor: native arena hot loop (paper simulation only)"

[lib]
name = "gpm_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
